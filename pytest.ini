[pytest]
testpaths = backend/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
filterwarnings =
    ignore:.*deprecated - use 'add_parse_action'.*:pyparsing.warnings.PyparsingDeprecationWarning
    ignore:.*deprecated - use 'one_of'.*:pyparsing.warnings.PyparsingDeprecationWarning
    ignore:.*deprecated - use 'set_results_name'.*:pyparsing.warnings.PyparsingDeprecationWarning
    ignore:.*deprecated - use 'infix_notation'.*:pyparsing.warnings.PyparsingDeprecationWarning
